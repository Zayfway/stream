<!DOCTYPE html>
<html lang="en" data-theme="sunset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d070b" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <title>MeyStream — Your movies &amp; shows, your style</title>
    <meta name="description" content="MeyStream is a sleek, themeable catalogue for movies and TV shows powered by TMDB. Browse, build your list, and plug in your own playback source." />
    <meta name="keywords" content="MeyStream, movie catalogue, tv shows, watchlist, tmdb, streaming ui" />
    <meta name="author" content="MeyStream" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MeyStream — Your movies & shows, your style" />
    <meta property="og:description" content="A sleek, themeable catalogue for movies and TV shows. Browse, build your list, and plug in your own playback source." />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MeyStream — Your movies & shows, your style" />
    <meta name="twitter:description" content="A sleek, themeable catalogue for movies and TV shows." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Apply the saved theme before paint to avoid a flash -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('meystream-theme');
          if (t && t.indexOf('custom:') === 0) {
            var vars = JSON.parse(localStorage.getItem('meystream-active-custom-vars') || '{}');
            for (var k in vars) root.style.setProperty(k, vars[k]);
            root.setAttribute('data-theme', 'custom');
          } else {
            var valid = ['sunset','flamingo','ember','peach','aurora','ocean','grape','rosegold','midnight','mono'];
            root.setAttribute('data-theme', valid.indexOf(t) !== -1 ? t : 'sunset');
          }
        } catch (e) {}
        root.style.colorScheme = 'dark';
      })();
    </script>
  </head>

  <body>
    <!-- Branded splash shown while the app bundle loads -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0d070b; transition: opacity .55s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .inner {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        animation: splashPop .55s ease both;
      }
      #splash .name {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: #fff;
      }
      #splash .name .g {
        background: linear-gradient(135deg, #d85f78, #e8824a);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #splash .bar {
        width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgba(255,255,255,.1);
      }
      #splash .bar::after {
        content: ''; display: block; height: 100%; width: 40%; border-radius: 3px;
        background: linear-gradient(135deg, #d85f78, #e8824a);
        animation: splashBar 1.1s ease-in-out infinite;
      }
      @keyframes splashPop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes splashBar { 0% { transform: translateX(-130%);} 100% { transform: translateX(330%);} }
    </style>
    <div id="splash">
      <div class="inner">
        <svg width="72" height="72" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d85f78"/>
              <stop offset="1" stop-color="#e8824a"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#sg)"/>
          <path d="M8 23V11L16 19L24 11V23" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="name"><span class="g">Mey</span>Stream</div>
        <div class="bar"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
